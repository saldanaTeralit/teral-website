<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro — Teral IT Solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3">
  <link rel="icon" href="src/img/Teral/teral morado (1).png" type="image/png">

  <style>
    body {
      background: var(--dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    #bgc {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── LOGIN BOX ── */
    .login-container {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-logo {
      margin-bottom: 2rem;
      animation: fUp .6s ease both;
    }

    .login-card {
      width: 100%;
      background: rgba(15, 10, 26, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(171, 71, 188, 0.08);
      transition: border-color .3s, box-shadow .3s;
      animation: fUp .7s .1s ease both;
    }

    .login-card:hover {
      border-color: rgba(171, 71, 188, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 60px rgba(171, 71, 188, 0.14);
    }

    .login-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--p3);
      margin-bottom: 0.6rem;
    }

    .login-title {
      font-size: 1.7rem;
      font-weight: 800;
      margin-bottom: 2.2rem;
      color: #fff;
      letter-spacing: -.03em;
    }

    .login-title em {
      font-style: normal;
      background: linear-gradient(90deg, #CE93D8, #AB47BC);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── INPUTS ── */
    .input-group {
      position: relative;
      margin-bottom: 1.8rem;
      text-align: left;
    }

    .input-group input {
      width: 100%;
      padding: 0.9rem 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--p2);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 15px rgba(171, 71, 188, 0.15);
    }

    .input-group label {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 14.5px;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: -9px;
      left: 10px;
      font-size: 11px;
      color: var(--p3);
      background: #0E001A; /* matches --dark */
      padding: 0 6px;
      font-weight: 600;
      border-radius: 4px;
    }

    .input-group input[type="password"] {
      padding-right: 44px;
    }

    .pass-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: rgba(255, 255, 255, 0.35);
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .pass-toggle:hover {
      color: var(--p3);
    }

    /* ── BUTTON ── */
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--p1), var(--p2));
      color: #fff;
      border: none;
      padding: 0.95rem;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      cursor: none;
      transition: all 0.3s;
      box-shadow: 0 8px 24px rgba(123, 31, 162, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(123, 31, 162, 0.5);
      opacity: 0.95;
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    /* ── FEEDBACK ANIMATIONS ── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-8px); }
      30%, 60%, 90% { transform: translateX(8px); }
    }

    .shake-anim {
      animation: shake 0.45s ease-in-out;
    }

    .error-box {
      background: rgba(239, 83, 80, 0.08);
      border: 1px solid rgba(239, 83, 80, 0.25);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      color: #ef5350;
      font-size: 13.5px;
      margin-bottom: 1.5rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      text-align: left;
      line-height: 1.4;
      animation: fUp 0.3s ease;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2.2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-to-site {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: rgba(255, 255, 255, 0.4);
      text-decoration: none;
      font-size: 13.5px;
      margin-top: 1.8rem;
      transition: color 0.2s;
      font-weight: 500;
      animation: fUp .7s .2s ease both;
    }

    .back-to-site:hover {
      color: #fff;
    }
  </style>
</head>

<body>
  <!-- Custom interactive cursors -->
  <div id="cur"></div>
  <div id="curR"></div>

  <!-- Background Animated Particles -->
  <canvas id="bgc"></canvas>

  <div class="login-container">
    <!-- Teral Logo Link -->
    <a href="index.html" class="login-logo">
      <img src="src/img/Teral/teral_n.png" alt="Teral IT Solutions" height="42">
    </a>

    <!-- Login Form Card -->
    <div class="login-card" id="loginCard">
      <span class="login-tag">Área de Clientes</span>
      <h2 class="login-title">Acceso <em>Seguro</em></h2>

      <!-- Dynamic Error Box -->
      <div class="error-box" id="errorBox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
          <line x1="12" y1="9" x2="12" y2="13" />
          <line x1="12" y1="17" x2="12.01" y2="17" />
        </svg>
        <span id="errorMessage">Credenciales incorrectas. Intenta de nuevo.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <!-- Email Input Group -->
        <div class="input-group">
          <input type="email" id="email" placeholder=" " required autocomplete="username">
          <label for="email">Correo Electrónico</label>
        </div>

        <!-- Password Input Group -->
        <div class="input-group">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password">
          <label for="password">Contraseña</label>
          <button type="button" class="pass-toggle" onclick="togglePasswordVisibility()" aria-label="Mostrar contraseña">
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Ingresar a la Plataforma →</span>
        </button>
      </form>
    </div>

    <!-- Back Button to landing -->
    <a href="index.html" class="back-to-site">
      ← Volver al sitio principal
    </a>
  </div>

  <script src="js/main.js?v=3"></script>
  <script>
    /* Secure Cryptographic SHA-256 Hashing using Web Crypto API */
    async function sha256(str) {
      const msgBuffer = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    /* Predefined Static Authorized SHA-256 Signatures */
    const HASHED_USERS = {
      // contacto@teralsupport.com -> 558ca3f0ab6e8763212d60e3a51c962bd21c50066027d3323510a74afebdd8cc
      // 5532Isacogame12 -> cefdfc825c0c2005b514ccb7375304e2345f9b643f0af5aade18c6bf5e6b3332
      '558ca3f0ab6e8763212d60e3a51c962bd21c50066027d3323510a74afebdd8cc': 'cefdfc825c0c2005b514ccb7375304e2345f9b643f0af5aade18c6bf5e6b3332',
      
      // info@microsipbajio.com -> f7e6e0837c2c0926acbbadb535b17de37cb0945dbbb5a11973ea9b52b0b65579
      // jcelisl2026 -> 2e7b6504c717e62919004a396a7d003966e7b5e946b25cc98b7208a262854003
      'f7e6e0837c2c0926acbbadb535b17de37cb0945dbbb5a11973ea9b52b0b65579': '2e7b6504c717e62919004a396a7d003966e7b5e946b25cc98b7208a262854003'
    };

    /* Toggle Password Visibility Handler */
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.pass-toggle');
      const eyeOpen = toggleBtn.querySelector('.eye-open');
      const eyeClosed = toggleBtn.querySelector('.eye-closed');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeOpen.style.display = 'none';
        eyeClosed.style.display = 'block';
        toggleBtn.setAttribute('aria-label', 'Ocultar contraseña');
      } else {
        passInput.type = 'password';
        eyeOpen.style.display = 'block';
        eyeClosed.style.display = 'none';
        toggleBtn.setAttribute('aria-label', 'Mostrar contraseña');
      }
    }

    /* Core Login Submission Handler with async hashing check */
    async function handleLogin(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const card = document.getElementById('loginCard');
      const errorBox = document.getElementById('errorBox');
      const errorMessage = document.getElementById('errorMessage');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      // Clear previous error
      errorBox.style.display = 'none';
      card.classList.remove('shake-anim');

      // Disable button during calculation to prevent double clicks
      submitBtn.disabled = true;
      btnText.textContent = 'Verificando...';
      btnSpinner.style.display = 'block';

      try {
        // Calculate SHA-256 hashes asynchronously
        const emailHash = await sha256(email);
        const passwordHash = await sha256(password);

        // Validate hashes
        if (HASHED_USERS[emailHash] && HASHED_USERS[emailHash] === passwordHash) {
          // SUCCESS: Show visual pending/loader
          btnText.textContent = 'Autenticando...';
          
          setTimeout(() => {
            sessionStorage.setItem('teral_session', 'active');
            window.location.href = 'cotizador-microsip.html';
          }, 800); // Elegant wait for visual validation complete
        } else {
          // FAILURE: Restore state and trigger premium shake feedback
          setTimeout(() => {
            submitBtn.disabled = false;
            btnText.textContent = 'Ingresar a la Plataforma →';
            btnSpinner.style.display = 'none';
            
            card.classList.add('shake-anim');
            errorBox.style.display = 'flex';
            
            if (!HASHED_USERS[emailHash]) {
              errorMessage.textContent = 'El correo electrónico no está registrado.';
            } else {
              errorMessage.textContent = 'La contraseña ingresada es incorrecta.';
            }
          }, 400);
        }
      } catch (err) {
        console.error('Error in hashing:', err);
        submitBtn.disabled = false;
        btnText.textContent = 'Ingresar a la Plataforma →';
        btnSpinner.style.display = 'none';
        card.classList.add('shake-anim');
        errorBox.style.display = 'flex';
        errorMessage.textContent = 'Error interno en la autenticación.';
      }
    }
  </script>
</body>

</html>
